<!DOCTYPE html>
<html lang=''>
    <head>
        <meta charset='UTF-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        
        <script src='https://code.jquery.com/jquery-3.6.0.js' integrity='sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=' crossorigin='anonymous'></script>
        
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css">
        <link rel='stylesheet' href='style.css'>

        <title>Skinshop</title>
    </head>

    <body>
        <main class='fade'>
            <div class='header'>
                <div class='header-camera' data-value='1'><i class="fas fa-hat-cowboy"></i></div>
                <div class='header-camera' data-value='2'><i class="fas fa-tshirt"></i></div>
                <div class='header-camera' data-value='3'><i class="fas fa-shoe-prints"></i></div>
            </div>

            <div class='blocks-container'>
                
            </div>

            <div class='buttons-container'>
                <div class='buyBttn' onclick='makeBuyAction()'>
                    <p>COMPRAR</p>
                </div>

                <div class='returnBttn' onclick='reset()'>
                    <p>REDEFINIR</p>
                </div>
            </div>
        </main>

        <script src='script.js'></script>
    </body>
</html>
