<!DOCTYPE html>
<html>
    <head>
        <title>#flame</title>

        <!-- METAS -->
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- CSS -->
        <link rel="stylesheet" href="./src/css/style.css">

        <!-- JS -->
        <script src="./src/js/font.js"></script>
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    </head>

    <body style="display: none;">
        <main>
            <header>

                <div>
                    </div>
                </div>
            </header>

            <section>
                <content>
                    <div class="list">
                        <div class="item list-item" data-name="${item.name}">
                            <div class="item-photo" style="background-image: url(./src/images/carro2.png);"></div>
                            <div class="item-desc">
                                <small>CARRO</small>
                                <span>Lancer</span>
                            </div>
                            
                            <div class="button-actions">
                                <button onclick="setCarro()" class="make">
                                    <span><i class="fas fa-check-circle"></i></span>
                                    <small>Selecionar</small>
                                </button>
                            </div>
                        </div>

                        <div class="item list-item" data-name="${item.name}">
                            <div class="item-photo" style="background-image: url(./src/images/moto2.png);"></div>
                            <div class="item-desc">
                                <small>MOTO</small>
                                <span>Cbr</span>
                            </div>
                            
                            <div class="button-actions">
                                <button onclick="setMoto()" class="make">
                                    <span><i class="fas fa-check-circle"></i></span>
                                    <small>Selecionar</small>
                                </button>
                            </div>
                        </div>

                        <div class="item list-item" data-name="${item.name}">
                            <div class="item-photo" style="background-image: url(./src/images/five.png);"></div>
                            <div class="item-desc">
                                <small>KIT</small>
                                <span>PVP</span>
                            </div>
                            
                            <div class="button-actions">
                                <button onclick="setGun()" class="make">
                                    <span><i class="fas fa-check-circle"></i></span>
                                    <small>Selecionar</small>
                                </button>
                            </div>
                        </div>
                    </div>
                </content>
            </section>
        </main>
    </body>
    <script src="./src/js/app.js"></script>
</html>
